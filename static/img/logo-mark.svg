<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Readium logo mark">
  <defs>
    <radialGradient id="gClock" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#2f7cff"></stop>
      <stop offset="100%" stop-color="#1247d6"></stop>
    </radialGradient>
    <linearGradient id="gBook" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f7fbff"></stop>
      <stop offset="55%" stop-color="#ffffff"></stop>
      <stop offset="100%" stop-color="#e9f1ff"></stop>
    </linearGradient>
    <linearGradient id="gShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b2f8f" stop-opacity="0.45"></stop>
      <stop offset="100%" stop-color="#0b2f8f" stop-opacity="0"></stop>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="b"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <!-- CLOCK (behind) -->
  <g transform="translate(0 0)">
    <!-- outer white ring -->
    <circle cx="256" cy="214" r="146" fill="none" stroke="#ffffff" stroke-width="22" opacity="0.98"></circle>
    <!-- clock body -->
    <circle cx="256" cy="214" r="132" fill="url(#gClock)"></circle>
    <!-- top highlight -->
    <path d="M156 170c30-52 82-82 140-82 18 0 36 3 52 9" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="16" stroke-linecap="round"></path>

    <!-- ticks -->
    <g stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.95">
      <line x1="256" y1="104" x2="256" y2="128"></line>
      <line x1="148" y1="214" x2="172" y2="214"></line>
      <line x1="340" y1="214" x2="364" y2="214"></line>
      <line x1="186" y1="140" x2="204" y2="156" opacity="0.85"></line>
    </g>

    <!-- hands -->
    <g stroke="#ffffff" stroke-linecap="round">
      <line x1="256" y1="214" x2="188" y2="162" stroke-width="22"></line>
      <line x1="256" y1="214" x2="336" y2="156" stroke-width="22"></line>
      <circle cx="256" cy="214" r="18" fill="#ffffff"></circle>
    </g>
  </g>

  <!-- BOOK (front) -->
  <g filter="url(#soft)">
    <!-- book base shadow -->
    <path d="M118 330c70-34 206-34 276 0v58H118z" fill="url(#gShadow)"></path>

    <!-- left cover -->
    <path d="M118 246c58-18 118-12 168 10v172c-50-24-110-30-168-10z" fill="#0f4bd6"></path>
    <!-- right cover -->
    <path d="M394 246c-58-18-118-12-168 10v172c50-24 110-30 168-10z" fill="#0f4bd6"></path>

    <!-- pages (left) -->
    <path d="M138 256c50-14 96-8 136 10v140c-40-18-86-24-136-10z" fill="url(#gBook)"></path>
    <!-- pages (right) -->
    <path d="M374 256c-50-14-96-8-136 10v140c40-18 86-24 136-10z" fill="url(#gBook)"></path>

    <!-- spine / center fold -->
    <path d="M256 266v154" stroke="#bcd6ff" stroke-width="6" opacity="0.85"></path>

    <!-- page lines (left) -->
    <g stroke="#86b5ff" stroke-width="10" stroke-linecap="round" opacity="0.55">
      <line x1="164" y1="304" x2="230" y2="304"></line>
      <line x1="164" y1="332" x2="234" y2="332"></line>
      <line x1="164" y1="360" x2="224" y2="360"></line>
    </g>

    <!-- bottom curve -->
    <path d="M138 396c50-12 96-6 136 12 40-18 86-24 136-12" fill="none" stroke="#0837a8" stroke-width="18" stroke-linecap="round" opacity="0.55"></path>
  </g>
</svg>